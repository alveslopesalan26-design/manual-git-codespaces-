<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
  <meta charset="UTF-8"> 
  <title>AgrovendaPortal</title>  <!-- TAREFA: coloque o nome do portal aqui --> AgrovendaPortal
  <!-- TAREFA: adicione o link para o style.css aqui --> <link rel="stylesheet" href="styles.css">
</head> 
<body> 
 
  <div class="Cadastroagrovendas">   <!-- TAREFA: defina o nome da classe do container --> 
	<h1>AgroVenda Digital</h1> 
	<h2>Criar sua conta</h2> 
 
	<form id="formCadastro"> 
 
  	<!-- TAREFA: crie o campo Nome Completo com label e input type="text" --> 
     
       <label for="nome-completo">Nome Completo:</label>
      <input type="text" id="nome-completo" name="nome_completo" required>
    
 
  	<!-- TAREFA: crie o campo E-mail com label e input type="email" --> 
     
      <label for="e-mail">E-mail:</label>
     <input type="email" id="e-mail" email="e-mail" required>
      
 
  	<!-- TAREFA: crie o campo Senha com label e input type="password" --> 
      <label for="password">Senha:</label>
     <input type="password" id="password" password="Senha" required>

  	<!-- TAREFA: crie o botão Cadastrar --> 
     <button id="btn-cadastrar" class="btn-primary" type="button">Cadastrar</button>
 
	</form> 
  </div> 
 
  <!-- TAREFA: adicione o link para o script.js aqui, antes de </body> --> 
   <script src="script.js"></script>

</body> 
</html>
